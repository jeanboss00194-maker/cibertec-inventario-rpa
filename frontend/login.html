<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Smart Inventory CIBERTEC</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="pagina-login">
  <div class="login-card">
    <div class="login-logo">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5">
        <circle cx="12" cy="12" r="9" stroke-opacity="0.35"/>
        <path d="M4 12a8 8 0 0 1 8-8" />
        <circle cx="7" cy="9" r="1.2" fill="#2563eb" stroke="none"/>
        <circle cx="12" cy="6" r="1.2" fill="#2563eb" stroke="none"/>
        <circle cx="17" cy="10" r="1.2" fill="#2563eb" stroke="none"/>
        <path d="M7 9l5-3 5 4" stroke-opacity="0.6"/>
        <path d="M8 14h8v6H8z" stroke-opacity="0.5"/>
        <ellipse cx="12" cy="14" rx="4" ry="1.4" stroke-opacity="0.5"/>
      </svg>
    </div>
    <h1>SMART INVENTORY <span>CIBERTEC</span></h1>
    <p class="login-sub">Sistema de Automatización de Inventarios de Equipos Informáticos</p>

    <form id="form-login" autocomplete="off">
      <label class="campo-icono">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input type="text" id="input-usuario" placeholder="Usuario" required>
      </label>
      <label class="campo-icono">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input type="password" id="input-clave" placeholder="Contraseña" required>
      </label>
      <p class="login-error" id="login-error" hidden></p>
      <button type="submit">Iniciar sesión</button>
    </form>
    <p class="login-hint">Acceso de demostración de Prototipo <strong> (Administrador) </strong></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
