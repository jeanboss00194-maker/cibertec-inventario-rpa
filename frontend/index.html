<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Inventory CIBERTEC</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6">
          <circle cx="12" cy="12" r="9" stroke-opacity="0.35"/>
          <circle cx="7" cy="9" r="1.2" fill="#38bdf8" stroke="none"/>
          <circle cx="12" cy="6" r="1.2" fill="#38bdf8" stroke="none"/>
          <circle cx="17" cy="10" r="1.2" fill="#38bdf8" stroke="none"/>
          <path d="M7 9l5-3 5 4" stroke-opacity="0.6"/>
        </svg>
        <div>
          <div class="logo-title">SMART INVENTORY</div>
          <div class="logo-sub">CIBERTEC</div>
        </div>
      </div>
      <nav id="nav-principal">
        <a href="#dashboard" data-ruta="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
          Dashboard Principal
        </a>
        <a href="#inventario" data-ruta="inventario">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Inventario
        </a>
        <a href="#rpa" data-ruta="rpa" data-solo-admin="1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="11" rx="2"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><path d="M12 7V4M9 4h6"/></svg>
          Automatización RPA
        </a>
        <a href="#analitica" data-ruta="analitica" data-solo-admin="1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16"/><rect x="6" y="11" width="3" height="6"/><rect x="11" y="7" width="3" height="10"/><rect x="16" y="13" width="3" height="4"/></svg>
          Dashboard Inteligente
        </a>
        <a href="#reportes" data-ruta="reportes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>
          Reportes
        </a>
        <a href="#usuarios" data-ruta="usuarios" data-solo-admin="1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.3c2.6.3 4.5 2.2 4.5 5.7"/></svg>
          Usuarios
        </a>
        <a href="#bitacora" data-ruta="bitacora" data-solo-admin="1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M8 7h8M8 11h8"/></svg>
          Bitácora de cambios
        </a>
        <a href="#configuracion" data-ruta="configuracion" data-solo-admin="1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.5h4.4l.4-2.5a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.6c.07-.4.1-.8.1-1.2z"/></svg>
          Configuración
        </a>
        <a href="#ayuda" data-ruta="ayuda">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.5-2.3 1.8-2.3 3.3"/><circle cx="12" cy="17" r="0.3" fill="currentColor"/></svg>
          Ayuda
        </a>
      </nav>
      <button id="btn-logout" class="btn-logout">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Cerrar sesión
      </button>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="estado-conexion" id="estado-conexion">● conectando…</span>
        <span class="topbar-saludo">Bienvenido, <strong id="topbar-nombre">Martha García</strong> <span class="badge operativo" id="topbar-rol" style="margin-left:6px;"></span></span>
        <div class="avatar">MG</div>
      </header>
      <main class="content" id="vista"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
